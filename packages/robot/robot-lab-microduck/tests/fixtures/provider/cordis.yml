# Real package-owned integration; no model request or replacement Web server.
- id: session
  name: '@deepseek-ai/dsh-session'
- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'
- id: agent
  name: '@deepseek-ai/dsh-agent'
- id: llm
  name: '@deepseek-ai/dsh-llm'
- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
- id: tools
  name: '@deepseek-ai/dsh-tools'
- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
- id: fs
  name: '@deepseek-ai/dsh-fs-local'
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'
- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: workspace-write
- id: robot-lab
  name: '@deepseek-ai/dsh-robot-lab'
- id: robot-lab-microduck
  name: '@deepseek-ai/dsh-robot-lab-microduck'
  config:
    sourceRoot: !!js process.env.DSH_MICRODUCK_SOURCE_ROOT
    pythonBin: !!js process.env.DSH_MICRODUCK_PYTHON
    mlxPythonBin: !!js process.env.DSH_MICRODUCK_MLX_PYTHON || undefined
    rlxPythonBin: !!js process.env.DSH_MICRODUCK_RLX_PYTHON || undefined
    rlxSourceRoot: !!js process.env.DSH_MICRODUCK_RLX_SOURCE_ROOT || undefined
    maxTrainingSteps: !!js "process.env.DSH_ROBOT_LIFECYCLE === '1' ? 200000 : 2048"
    maxConcurrentTraining: 1
    snapshotSteps: !!js "process.env.DSH_ROBOT_LIFECYCLE === '1' ? 1 : 1024"
    graceMs: 1000
    maxEnvs: 2
    maxSimulationSteps: !!js "process.env.DSH_ROBOT_DANCE === '1' ? 1000 : 100"
    maxEvaluationEpisodes: 2
    trainingTimeoutMs: 120000
