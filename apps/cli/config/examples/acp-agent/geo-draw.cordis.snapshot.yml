# Keyless replay counterpart to geo-draw.cordis.yml: the geo seam, the fixture
# provider, the geoCommand projection, and the control tools stay real (the tool
# calls re-execute the actual appends and fold); only the model adapter is
# replaced by replay.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - insert:
          - id: geo
            name: '@deepseek-ai/dsh-geo'
          - id: geo-fixture-provider
            name: './geo-fixture-provider.mjs'
          - id: geo-command
            name: '@deepseek-ai/dsh-geo-command'
          - id: tool-geo-control
            name: '@deepseek-ai/dsh-tool-geo-control'
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'
            config:
              providers:
                - id: deepseek-official
                  name: DeepSeek
                  models:
                    - id: deepseek-v4-flash
                    - id: deepseek-v4-pro
