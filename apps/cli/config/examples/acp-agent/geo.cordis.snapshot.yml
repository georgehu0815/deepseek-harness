# Keyless replay counterpart to geo.cordis.yml: the geo seam, the deterministic
# fixture provider, and the read tools stay real (the tool calls re-execute the
# actual ctx.geo lookups against fixed data); only the model adapter is replaced
# by replay.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - insert:
          - id: geo
            name: '@deepseek-ai/dsh-geo'
          - id: geo-fixture-provider
            name: './geo-fixture-provider.mjs'
          - id: tool-geo-query
            name: '@deepseek-ai/dsh-tool-geo-query'
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'
            config:
              providers:
                - id: deepseek-official
                  name: DeepSeek
                  models:
                    - id: deepseek-v4-flash
                    - id: deepseek-v4-pro
