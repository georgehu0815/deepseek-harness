# Keyless model-output fixture: the real Robot Lab service reports an absent
# provider, rather than admitting training or inventing environment readiness.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: persistence
        config:
          root: './.sessions'
          compression: none
      - insert:
          - id: robot-lab
            name: '@deepseek-ai/dsh-robot-lab'
          - id: tool-robot-lab
            name: '@deepseek-ai/dsh-tool-robot-lab'
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'
