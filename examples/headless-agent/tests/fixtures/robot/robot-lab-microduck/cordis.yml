# Real installed-physics integration fixture; no model request is made.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ../../../../cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - insert:
          - id: sandbox
            name: '@deepseek-ai/dsh-sandbox-local'
          - id: sandbox-policy
            name: '@deepseek-ai/dsh-sandbox-policy'
            config:
              mode: workspace-write
          - id: robot-lab
            name: '@deepseek-ai/dsh-robot-lab'
          - id: robot-lab-microduck
            name: '@deepseek-ai/dsh-robot-lab-microduck'
            config:
              sourceRoot: !!js process.env.DSH_MICRODUCK_SOURCE_ROOT
              pythonBin: !!js process.env.DSH_MICRODUCK_PYTHON
              mlxPythonBin: !!js process.env.DSH_MICRODUCK_MLX_PYTHON || undefined
              maxTrainingSteps: 2048
              maxEnvs: 2
              maxSimulationSteps: 100
              maxEvaluationEpisodes: 2
              trainingTimeoutMs: 120000
